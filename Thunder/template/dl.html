<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading: {{ file_name }}</title>
    <meta http-equiv="refresh" content="0;url={{ src|safe }}">
    <meta name="theme-color" content="#06070a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #06070a;
            --bg-glass: rgba(20, 24, 38, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.4);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.18;
            pointer-events: none;
        }
        .orb-1 { top: -100px; left: 10%; background: #6366f1; }
        .orb-2 { bottom: -100px; right: 10%; background: #06b6d4; }
        .card {
            position: relative;
            z-index: 1;
            max-width: 540px;
            width: 100%;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            animation: bounce-subtle 2s infinite ease-in-out;
        }
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .icon-wrap svg { width: 32px; height: 32px; fill: white; }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .filename {
            font-size: 0.92rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            word-break: break-all;
            margin-bottom: 24px;
        }
        p {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: var(--radius-full);
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
        }
        .dl-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="card">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        </div>
        <h1>Starting Your Download</h1>
        <div class="filename">{{ file_name }}</div>
        <p>Your download should start automatically within moments. If it does not, click the button below:</p>
        <a href="{{ src|safe }}" download="{{ file_name }}" class="dl-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Click Here to Download
        </a>
    </div>
</body>
</html>
